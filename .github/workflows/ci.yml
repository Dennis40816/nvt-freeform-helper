name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, '[0-9]+.[0-9]+.x']

permissions:
  contents: read

# A new push to a pull request supersedes the running check. Pushes to main and the trunk get one group
# per commit, so none is cancelled or replaced while pending and every merged commit keeps a real result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Lanes and shards are named here; scripts/verify.ps1 decides what each one contains.
# Required checks: "policy / structure" and "dotnet / build-test". The aggregator currently does not
# count a failing viewmodel shard (see dotnet-test below).
jobs:
  structure:
    name: policy / structure
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out text files with CRLF
        run: git config --global core.autocrlf true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify structure
        shell: pwsh
        run: ./scripts/verify.ps1 -StructureOnly -AllowMissingExampleData
      - name: Check the test shard policy scripts
        shell: pwsh
        # A child process in the harness leaves $LASTEXITCODE at 1 on purpose (negative cases), and the
        # step wrapper exits with that value. A separate process reports only the harness result.
        run: pwsh -NoProfile -File ./scripts/tests/check-test-shard-policy.ps1

  dotnet-build:
    name: dotnet / build
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: windows-latest
    # The health check does its own non-incremental Release build after the build lane.
    timeout-minutes: 35
    steps:
      - name: Check out text files with CRLF
        run: git config --global core.autocrlf true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned .NET SDK and runtime
        shell: pwsh
        run: ./scripts/ci/install-dotnet.ps1
      - name: Format, analyzers and build
        shell: pwsh
        run: ./scripts/verify.ps1 -CiLane build -AllowMissingExampleData
      # The baseline and the test-debt ledger were enrolled with English tool output. A pull request is also
      # compared with its base commit, so the ledgers cannot grow and the checker files cannot drift.
      - name: Verify enrolled C# code health
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOTNET_CLI_UI_LANGUAGE: en
          VSLANG: '1033'
          PreferredUILang: en-US
          MSBUILDDISABLENODEREUSE: '1'
          UseSharedCompilation: 'false'
          DOTNET_CLI_USE_MSBUILD_SERVER: '0'
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            if ([string]::IsNullOrWhiteSpace($env:PR_BASE_SHA)) {
              throw 'Pull-request code-health verification requires a base SHA.'
            }
            pwsh -NoProfile -File eng/core-health/repo-health.ps1 -Mode Verify -Repo nfh -Root . -Solution FreeformHelper.sln -BaseRef $env:PR_BASE_SHA
          } else {
            pwsh -NoProfile -File eng/core-health/repo-health.ps1 -Mode Verify -Repo nfh -Root . -Solution FreeformHelper.sln
          }
          exit $LASTEXITCODE

  dotnet-test:
    name: dotnet / test (${{ matrix.shard }})
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 30
    # The viewmodel shard (FreeformHelperViewModelTests only) is reported but does not block merging
    # yet: those tests time out or stall on runners with few cores (TODO.md S15.002). Owner decision of
    # 2026-10-02; remove this line when that item is closed, so the shard is required again. Every other
    # shard, including the remaining UI classes in 'ui', blocks.
    continue-on-error: ${{ matrix.shard == 'viewmodel' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [core, ui, viewmodel, snapshots]
    env:
      # The golden tests need the private example data. A run that has no deploy key fails here, so a
      # lost key cannot turn into skipped tests. Fork and dependabot pull requests are the only runs
      # that go without the key: they are reported as unverified and cannot merge.
      HAS_TESTDATA_KEY: ${{ secrets.TESTDATA_DEPLOY_KEY != '' }}
      UNVERIFIED: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
    steps:
      - name: Check out text files with CRLF
        run: git config --global core.autocrlf true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve the pinned example data commit
        id: example
        if: env.HAS_TESTDATA_KEY == 'true'
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD:example
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve the example submodule commit." }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Checkout private example data
        if: env.HAS_TESTDATA_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/FreeformHelper-testdata
          ref: ${{ steps.example.outputs.sha }}
          ssh-key: ${{ secrets.TESTDATA_DEPLOY_KEY }}
          path: example
          persist-credentials: false
      - name: Install pinned .NET SDK and runtime
        shell: pwsh
        run: ./scripts/ci/install-dotnet.ps1
      - name: Run test shard
        shell: pwsh
        # Below the job limit, so an overrun is a step failure (which continue-on-error covers for the
        # viewmodel shard) and the results are still uploaded, instead of a cancelled job.
        timeout-minutes: 25
        run: |
          $unverified = $env:UNVERIFIED -eq 'true'
          if (-not $unverified -and $env:HAS_TESTDATA_KEY -ne 'true') {
            throw 'The TESTDATA_DEPLOY_KEY secret is not available to this run.'
          }
          ./scripts/verify.ps1 -CiLane test -Shard ${{ matrix.shard }} -EnforceFloors -Unverified:$unverified -SummaryPath 'build/ci-test-summaries/${{ matrix.shard }}/shard-summary.json'
      - name: Upload the shard summary
        # The summary holds only counts, test class names and test method names. Never upload TRX files,
        # TestResults/, example/ or the build/ folder: a failed golden test can carry private text.
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-test-${{ matrix.shard }}-summary-attempt-${{ github.run_attempt }}
          path: build/ci-test-summaries/${{ matrix.shard }}/shard-summary.json
          if-no-files-found: ignore
          retention-days: 3

  dotnet:
    name: dotnet / build-test
    needs: [dotnet-build, dotnet-test]
    # Always runs, also on drafts: a skipped required check counts as passing, so this job must report a
    # failure whenever the build or the tests did not run to success.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the build and every test shard to succeed
        shell: pwsh
        env:
          BUILD_RESULT: ${{ needs.dotnet-build.result }}
          TEST_RESULT: ${{ needs.dotnet-test.result }}
        run: |
          if ($env:BUILD_RESULT -cne 'success') { throw "dotnet / build did not succeed: $env:BUILD_RESULT (skipped means the pull request is a draft)" }
          if ($env:TEST_RESULT -cne 'success') { throw "dotnet / test did not succeed: $env:TEST_RESULT (skipped means the pull request is a draft)" }
